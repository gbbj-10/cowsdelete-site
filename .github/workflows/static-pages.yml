name: 검색용 정적 페이지 만들기
on:
  schedule:
    - cron: '7,37 * * * *'      # 30분마다
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build-static.mjs', '.github/workflows/static-pages.yml']
permissions:
  contents: write
  pages: write
concurrency:
  group: static-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 글·공유·요청 페이지와 사이트맵 만들기
        run: node scripts/build-static.mjs
      - name: 바뀐 것이 있으면 올리고 사이트 다시 배포
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "cowsdelete-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "정적 페이지 갱신 (자동)"
          git push
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
